name: release

# The tag-side check of a release. `make ondewo_release` publishes to nuget.org from the release
# machine, waits until nuget.org serves the version, and only then pushes the branch, the tag and the
# GitHub release; pushing the tag triggers this workflow, which re-runs the test and packaging gates
# on the exact tree the tag points at, pushes the package only if nuget.org does not have it yet, and
# verifies nuget.org serves it. Nothing here is reachable from an ordinary push - ci.yml runs the same
# packaging path credential-free on every commit.
on:
  push:
    # GitHub filter-pattern syntax, not a regex: `+` means "one or more of the preceding
    # character". Matches the bare `8.7.0` tags `make create_release_tag` writes, and the
    # `8.7.0-rc.1` prerelease spelling; it deliberately does NOT match `release/8.7.0` branches.
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

# Read-only: this workflow uploads to nuget.org, never back into the repository. The GitHub release
# itself is created by `make push_to_gh` with GITHUB_GH_TOKEN, not by GITHUB_TOKEN here.
permissions:
  contents: read

# Never cancel a publish in flight, and never let two runs of the same tag race each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: pack + push to nuget.org
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # FIRST, and before the checkout, so a release cut without the secret configured dies in
      # seconds with an actionable message instead of building for ten minutes and then failing
      # inside `dotnet nuget push` with an opaque 401 - or, worse, appearing to succeed while
      # having uploaded nothing.
      - name: Require the NUGET_API_KEY secret
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -eu
          if [ -z "${NUGET_API_KEY:-}" ]; then
            echo "::error title=NUGET_API_KEY is not configured::The repository secret NUGET_API_KEY is empty or missing, so ${GITHUB_REF_NAME} cannot be published. Create an API key at https://www.nuget.org/account/apikeys scoped to Push for the glob pattern 'Ondewo.*', then add it under Settings -> Secrets and variables -> Actions -> New repository secret with the name NUGET_API_KEY. Re-run this workflow afterwards."
            exit 1
          fi
          echo "NUGET_API_KEY is configured."

      # This job packs the stubs that are COMMITTED under api/ - exactly like ci.yml, it never runs
      # protoc; regenerating them is a docker-bound developer step that has already happened by the
      # time the release tag exists.
      # actions/checkout starts with a bare `git init`, and git then prints a multi-line
      # "Using 'master' as the name for the initial branch" hint into every job log. Naming the
      # default up front silences it; master is this repository's default branch anyway.
      - name: Name git's default branch
        run: git config --global init.defaultBranch master

      - uses: actions/checkout@v7

      # ...and the compiler submodule IS, on its own. `make check_dotnet_properties` below reads the
      # pins out of its Dockerfile ARG lines, so with nothing on disk it had nothing to compare the
      # committed Directory.Build.props against: it warned and exited 0, which made the step below a
      # guaranteed no-op that had never once verified a pin. The target now fails in that situation,
      # and this step is what keeps it able to do its job. One small public repository, depth 1.
      - name: Check out the pinned proto-compiler submodule
        run: git submodule update --init --depth 1 ondewo-proto-compiler

      # The api submodule's own protos (not its nested s2t/sip/t2s submodules): the API-surface tests
      # DERIVE every ondewo.vtsi service and RPC from them, instead of hard-coding counts and lists
      # that break on the next API release. Without it they fall back to the committed stubs, and a
      # test asserts that CI does not.
      - name: Check out the pinned VTSI API submodule
        run: git submodule update --init --depth 1 ondewo-vtsi-api

      # The tag is what a consumer sees on GitHub; ONDEWO_VTSI_VERSION is what ends up in the
      # <version> of the .nupkg. Publishing 8.7.0 off a tag called 8.7.1 is unrecoverable - the
      # version can never be re-uploaded - so it is an error here rather than a surprise on
      # nuget.org.
      - name: Check the tag matches ONDEWO_VTSI_VERSION
        run: |
          set -eu
          version=$(sed -n 's|^ONDEWO_VTSI_VERSION=||p' Makefile)
          if [ -z "$version" ]; then
            echo "::error title=Cannot read ONDEWO_VTSI_VERSION::No 'ONDEWO_VTSI_VERSION=' line in the Makefile."
            exit 1
          fi
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error title=Tag/version mismatch::The tag is '${GITHUB_REF_NAME}' but the Makefile declares ONDEWO_VTSI_VERSION=${version}. Delete the tag, fix one of the two, and cut the release again."
            exit 1
          fi
          echo "Releasing ${version} from tag ${GITHUB_REF_NAME}."

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Check the committed stubs are present
        run: |
          set -eu
          test -f Ondewo.VTSI.Client.csproj
          stubs=$(find api -type f -name '*.cs' | wc -l)
          echo "committed csharp stub files: $stubs"
          test "$stubs" -gt 0

      - name: Verify the committed MSBuild pins
        run: make check_dotnet_properties

      # A release must not be able to ship something the ordinary CI gate would have rejected, so
      # the same two gates run again here on the exact tree the tag points at.
      - name: Test with the coverage gate
        run: make test

      - name: Dry-run the NuGet publish
        run: make publish_dry_run

      # `make release` pushes to nuget.org from the release machine and waits until nuget.org serves
      # the version BEFORE it pushes this tag, so on a regular release the version is already there and
      # this step says so and pushes nothing. It pushes only for a tag cut some other way. There is no
      # --skip-duplicate: a push that nuget.org refuses as a duplicate is a real failure, not a no-op.
      # The secret reaches `make push_to_nuget` through env: only: `dotnet nuget push` reads
      # NUGET_API_KEY from the environment (.NET SDK 10.0.400+, which setup-dotnet 10.0.x installs; the
      # recipe refuses an SDK that cannot), so the key is on no process's argv and never in the log.
      # Pushing the .nupkg uploads the .snupkg symbol package sitting beside it in nupkg/.
      - name: Push to nuget.org unless make release already did
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -eu
          if make --no-print-directory -s check_nuget_serves_version; then
            echo "nuget.org already serves Ondewo.VTSI.Client ${GITHUB_REF_NAME} (pushed by make release) - nothing to push."
            exit 0
          fi
          make push_to_nuget

      # Read-only: fails the run unless nuget.org lists the version and serves its .nupkg (polls for
      # up to 15 minutes while nuget.org validates and indexes a fresh upload).
      - name: Verify nuget.org serves the version
        run: make verify_nuget_published

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nupkg-${{ github.ref_name }}
          path: |
            nupkg/*.nupkg
            nupkg/*.snupkg
          if-no-files-found: error
